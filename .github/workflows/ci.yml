name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pinned: an unpinned linter means main can go red with no code change,
      # the moment ruff ships a new rule. Matches the pin skchat uses.
      - run: pip install ruff==0.15.4
      - run: ruff check src/

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]" || pip install -e .
      # This step must be able to fail the run. Never suffix it with a
      # success-swallowing shell guard. See card 62a5256d.
      - run: python -m pytest tests/ -v --tb=short
